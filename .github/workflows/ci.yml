name: quality-gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run worker:types
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run content:validate
      - run: npm run eval:grounding
      - run: npm run build
      - run: node scripts/verify-static-export.mjs
      - run: npx wrangler deploy --env="" --config apps/guide-api/wrangler.jsonc --dry-run
